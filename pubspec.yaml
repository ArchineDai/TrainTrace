name: traintrace
description: "A new Flutter project."
publish_to: 'none'
version: 0.6.0+5

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  # 只用 BarChart / LineChart（PLAN-v0.6 §4.1）。日历、KPI、人体图、横条自绘。
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  # 关于页的版本号。已经是 file_picker 的传递依赖，提为直接依赖不增体积；
  # 写死常量迟早和 pubspec 里的版本走样。
  package_info_plus: ^10.2.1
  # 人体热力图：把生成码里的 SVG path 字符串解析成 dart:ui Path（不引 flutter_svg，
  # 它不认 CSS class 动态上色，见 PLAN-v0.6 §4.6）。
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter:
  # flutter build / run 自动跑 gen-l10n（配置在 l10n.yaml）；改完 ARB 仍建议手动跑
  # scripts/check_l10n.ps1 看漏翻报告。
  generate: true
  uses-material-design: true

  # 首启导入的内置动作 / 模板 / 历史记录（core/db/seed/seed_loader.dart）。
  assets:
    - assets/seed/
    # 第三方素材的许可原文。字体的 OFL 与人体图的 MIT 都要求随分发保留，
    # 光放在仓库里不算 —— 必须打进包并在关于页可读（core/licenses.dart 注册）。
    - assets/licenses/

  # 西文 / 数字走 IBM Plex Sans（OFL），汉字回落到 Noto Sans SC（OFL）。
  # Noto 已子集化到 GB2312 + UI 符号（tool/fonts/subset_fonts.mjs），
  # 三档合计约 6 MB。字重只带 400 / 500 / 700，视觉方向靠这三档的层级成立。
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700

# 启动图标。源图由 tool/icon/gen_icon.mjs 生成到 assets/icon/，
# 改完源图后运行 `dart run flutter_launcher_icons` 重新产出各平台尺寸。
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#0C0D10"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_mono.png"
  ios: true
  remove_alpha_ios: true
